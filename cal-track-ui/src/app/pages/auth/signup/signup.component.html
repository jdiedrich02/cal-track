<div class="auth-container">
  <p-card class="auth-card">
    <div class="auth-header">
      <h2>Welcome To Cal Track!</h2>
      <p>Register Below</p>
    </div>
    <div class="auth-divider"></div>
    <div class="form-group">
      <label>Username</label>
      <input pInputText type="text" [(ngModel)]="username" placeholder="Enter your username"/>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input pInputText type="email" [(ngModel)]="email" placeholder="Enter your email"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <p-password [(ngModel)]="password" [style]="{'width':'100%'}" [inputStyle]="{'width':'100%'}" [feedback]="false" placeholder="Enter your password"></p-password>
    </div>
    <button pButton label="Register" class="auth-button" (click)="signup()"></button>
    <div class="auth-footer">
      <span>Already have an account?</span>
      <a routerLink="/login">Log In</a>
    </div>
  </p-card>
</div>
