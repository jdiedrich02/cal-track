<div class="macros-page-container">
  <div class="page-header">
    <h2>Macros</h2>
    <p-button label="Add Macro" icon="pi pi-plus" (onClick)="openDialog()" />
  </div>
  <p-table [value]="macros" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[5,10,20,50]" responsiveLayout="scroll" class="macros-table">
    <ng-template pTemplate="header">
      <tr>
        <th>Name</th>
        <th>Unit</th>
        <th>Calories</th>
        <th>Protein</th>
        <th>Carbs</th>
        <th>Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-macro>
      <tr>
        <td>{{ macro.name }}</td>
        <td>
          <p-tag [value]="macro.unit === 'quantity' ? 'Per item' : macro.grams + 'g'" [severity]="macro.unit === 'quantity' ? 'warn' : 'info'" [rounded]="true" />
        </td>
        <td>{{ macro.calories }}</td>
        <td>{{ macro.protein ?? '—' }}</td>
        <td>{{ macro.carbs ?? '—' }}</td>
        <td>
          <div class="action-buttons">
            <p-button icon="pi pi-pencil" [text]="true" severity="secondary" size="small" pTooltip="Edit" tooltipPosition="bottom" (onClick)="editMacro(macro)" />
            <p-button icon="pi pi-trash" [text]="true" severity="danger" size="small" pTooltip="Delete" tooltipPosition="bottom" (onClick)="deleteMacro(macro)" />
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="6">No records exist.</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<!-- Add new macro dialog -->
<p-dialog [header]="editingMacroId ? 'Edit Macro' : 'Add Macro Entry'" [(visible)]="showMacroDialog" [modal]="true" [closable]="true" [draggable]="false" [resizable]="false" [style]="{ width: '500px' }">
  @if (form) {
    <form [formGroup]="form" class="macro-form">
        <div class="field">
          <label for="name">Name</label>
          <input pInputText id="name" formControlName="name" />
        </div>
        <div class="field">
          <label>Measured By</label>
          <p-selectButton [options]="unitOptions" formControlName="unit" optionLabel="label" optionValue="value">
          </p-selectButton>
        </div>
        <div class="field">
          <label for="calories">Calories</label>
          <p-inputNumber inputId="calories" formControlName="calories" [min]="0" [useGrouping]="false" [showButtons]="true">
          </p-inputNumber>
        </div>
        <div class="field" *ngIf="form.get('unit')?.value !== 'quantity'">
          <label for="grams">Grams (reference amount)</label>
          <p-inputNumber inputId="grams" formControlName="grams" [min]="1" [useGrouping]="false" [showButtons]="true">
          </p-inputNumber>
        </div>
        <div class="field">
          <label for="protein">Protein (g)</label>
          <p-inputNumber inputId="protein" formControlName="protein" [min]="0" [useGrouping]="false" [showButtons]="true">
          </p-inputNumber>
        </div>
        <div class="field">
          <label for="carbs">Carbs (g)</label>
          <p-inputNumber inputId="carbs" formControlName="carbs" [min]="0" [useGrouping]="false" [showButtons]="true">
          </p-inputNumber>
        </div>
    </form>
  }
  <ng-template pTemplate="footer">
    <p-button label="Cancel" severity="secondary" [outlined]="true" (onClick)="closeDialog()" />
    <p-button label="Save" icon="pi pi-check" [disabled]="!form || form.invalid" (onClick)="saveMacro()" />
  </ng-template>
</p-dialog>
